spring.application.name=service-vendedor
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/db_vendedor?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Ruta donde se generará el JSON de la documentación
springdoc.api-docs.path=/api/v1/vendedores/v3/api-docs

# Título de la documentación
springdoc.swagger-ui.path=/swagger-ui.html
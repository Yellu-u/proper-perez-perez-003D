server:
  port: 9090

jwt:
  secret: "493358340235739058340598340598340598340598340598"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        # 1. RUTA DE AUTH: Libre para Login/Registro
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          
        # RUTA SERVICIO DE PRODUCTOS
        - id: service-productos
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/productos/**
          filters:
            - AuthenticationFilter


        # RUTA SERVICIO DE LINEA (dentro de producto)
        - id: service-linea
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/productos/linea/**
          filters:
            - AuthenticationFilter


        # RUTA SERVICIO DE CLIENTES
        - id: service-cliente
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/clientes/**
          filters:
            - AuthenticationFilter


        # RUTA SERVICIO DE EMPRESAS (dentro de cliente)
        - id: service-empresas
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/clientes/empresas/**
          filters:
            - AuthenticationFilter

        # RUTA SERVICIO DE VENDEDORES
        - id: service-vendedor
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/vendedores/**
          filters:
            - AuthenticationFilter


        # RUTA SERVICIO PEDIDO
        - id: service-pedido
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/pedido/**
          filters:
            - AuthenticationFilter


        # RUTA SERVICIO BONIFICACION
        - id: service-bonificacion
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/bonificaciones/**
          filters:
            - AuthenticationFilter


        # RUTA SERVICIO PAGO
        - id: service-pago
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/pagos/**
          filters:
            - AuthenticationFilter


        # RUTA SERVICIO INVENTARIO
        - id: service-inventario
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/inventario/**
          filters:
            - AuthenticationFilter

        
        # RUTA SERVICIO FACTURACIÓN
        - id: service-facturacion
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/facturacion/**
          filters:
            - AuthenticationFilter


        # RUTA SERVICIO DESPACHO
        - id: service-despacho
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/despachos/**
          filters:
            - AuthenticationFilter


        # RUTA SERVICIO REPORTE
        - id: service-reportes
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/reportes/**
          filters:
            - AuthenticationFilter


# Configuraciones externas al bloque 'spring'
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

springdoc:
  swagger-ui:
    urls:
      - name: Productos
        url: /api/v1/productos/v3/api-docs
      - name: Clientes
        url: /api/v1/clientes/v3/api-docs
      - name: Vendedores
        url: /api/v1/vendedores/v3/api-docs
      - name: Pedidos
        url: /api/v1/pedido/v3/api-docs
      - name: Bonificaciones
        url: /api/v1/bonificaciones/v3/api-docs
      - name: Pagos
        url: /api/v1/pagos/v3/api-docs
      - name: Inventario
        url: /api/v1/inventario/v3/api-docs
      - name: Facturación
        url: /api/v1/facturacion/v3/api-docs
      - name: Despachos
        url: /api/v1/despachos/v3/api-docs
      - name: Reportes
        url: /api/v1/reportes/v3/api-docs


logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG

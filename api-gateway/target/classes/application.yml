server:
  port: 9090

jwt:
  secret: "493358340235739058340598340598340598340598340598"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"

      routes:
        # AUTH: libre para login y registro
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        # PRODUCTOS (incluye líneas y docs)
        - id: service-productos
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/productos/**
          filters:
            - AuthenticationFilter

        # CLIENTES (incluye empresas y docs)
        - id: service-cliente
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/clientes/**
          filters:
            - AuthenticationFilter

        # VENDEDORES
        - id: service-vendedor
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/vendedores/**
          filters:
            - AuthenticationFilter

        # PEDIDOS
        - id: service-pedido
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/pedido/**
          filters:
            - AuthenticationFilter

        # BONIFICACIONES
        - id: service-bonificacion
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/bonificaciones/**
          filters:
            - AuthenticationFilter

        # PAGOS
        - id: service-pago
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/pagos/**
          filters:
            - AuthenticationFilter

        # INVENTARIO
        - id: service-inventario
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/inventario/**
          filters:
            - AuthenticationFilter

        # FACTURACIÓN
        - id: service-facturacion
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/facturacion/**
          filters:
            - AuthenticationFilter

        # DESPACHOS
        - id: service-despacho
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/despachos/**
          filters:
            - AuthenticationFilter

        # REPORTES 
        - id: service-reportes
          uri: http://localhost:8092
          predicates:
            - Path=/api/v1/reportes/**
          filters:
            - AuthenticationFilter

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

springdoc:
  swagger-ui:
    urls:
      - name: Productos
        url: /api/v1/productos/v3/api-docs
      - name: Clientes
        url: /api/v1/clientes/v3/api-docs
      - name: Vendedores
        url: /api/v1/vendedores/v3/api-docs
      - name: Pedidos
        url: /api/v1/pedido/v3/api-docs
      - name: Bonificaciones
        url: /api/v1/bonificaciones/v3/api-docs
      - name: Pagos
        url: /api/v1/pagos/v3/api-docs
      - name: Inventario
        url: /api/v1/inventario/v3/api-docs
      - name: Facturación
        url: /api/v1/facturacion/v3/api-docs
      - name: Despachos
        url: /api/v1/despachos/v3/api-docs
      - name: Reportes
        url: /api/v1/reportes/v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway: INFO
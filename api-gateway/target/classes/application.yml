server:
  port: 9090

jwt:
  secret: "493358340235739058340598340598340598340598340598"

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:9090"
            allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE 
            - OPTIONS
            allowed-headers: "*"
            
      routes:
        # 1. RUTA DE AUTH: Libre para Login/Registro
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**
          
        # RUTA SERVICIO DE PRODUCTOS
        - id: service-productos
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/productos/**
          filters:
            - AuthenticationFilter

        # PRODUCTOS DOCS
        - id: service-productos-docs
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/productos/v3/api-docs

        # RUTA SERVICIO DE LINEA (dentro de producto)
        - id: service-linea
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/productos/linea/**
          filters:
            - AuthenticationFilter

        # RUTA SERVICIO DE CLIENTES
        - id: service-cliente
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/clientes/**
          filters:
            - AuthenticationFilter

        # CLIENTES DOCS
        - id: service-clientes-docs
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/clientes/v3/api-docs

        # RUTA SERVICIO DE EMPRESAS (dentro de cliente)
        - id: service-empresas
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/clientes/empresas/**
          filters:
            - AuthenticationFilter

        # RUTA SERVICIO DE VENDEDORES
        - id: service-vendedor
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/vendedores/**
          filters:
            - AuthenticationFilter

        # VENDEDORES DOCS
        - id: service-vendedores-docs
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/vendedores/v3/api-docs

        # RUTA SERVICIO PEDIDO
        - id: service-pedido
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/pedido/**
          filters:
            - AuthenticationFilter

        # PEDIDO DOCS
        - id: service-pedido-docs
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/pedido/v3/api-docs

        # RUTA SERVICIO BONIFICACION
        - id: service-bonificacion
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/bonificaciones/**
          filters:
            - AuthenticationFilter

        # BONIFICACION DOCS
        - id: service-bonificacion-docs
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/bonificaciones/v3/api-docs

        # RUTA SERVICIO PAGO
        - id: service-pago
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/pagos/**
          filters:
            - AuthenticationFilter

        # PAGO DOCS
        - id: service-pagos-docs
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/pagos/v3/api-docs

        # RUTA SERVICIO INVENTARIO
        - id: service-inventario
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/inventario/**
          filters:
            - AuthenticationFilter

        # INVENTARIO DOCS
        - id: service-inventario-docs
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/inventario/v3/api-docs
        
        # RUTA SERVICIO FACTURACIÓN
        - id: service-facturacion
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/facturacion/**
          filters:
            - AuthenticationFilter

        # FACTURACIÓN DOCS
        - id: service-facturacion-docs
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/facturacion/v3/api-docs

        # RUTA SERVICIO DESPACHO
        - id: service-despacho
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/despachos/**
          filters:
            - AuthenticationFilter

        # DESPACHO DOCS
        - id: service-despacho-docs
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/despachos/v3/api-docs

        # RUTA SERVICIO REPORTE
        - id: service-reportes
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/reportes/**
          filters:
            - AuthenticationFilter

        # REPORTE DOCS
        - id: service-reportes-docs
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/reportes/v3/api-docs


# Configuraciones externas al bloque 'spring'
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

springdoc:
  swagger-ui:
    urls:
      - name: Productos
        url: /api/v1/productos/v3/api-docs
      - name: Clientes
        url: /api/v1/clientes/v3/api-docs
      - name: Vendedores
        url: /api/v1/vendedores/v3/api-docs
      - name: Pedidos
        url: /api/v1/pedido/v3/api-docs
      - name: Bonificaciones
        url: /api/v1/bonificaciones/v3/api-docs
      - name: Pagos
        url: /api/v1/pagos/v3/api-docs
      - name: Inventario
        url: /api/v1/inventario/v3/api-docs
      - name: Facturación
        url: /api/v1/facturacion/v3/api-docs
      - name: Despachos
        url: /api/v1/despachos/v3/api-docs
      - name: Reportes
        url: /api/v1/reportes/v3/api-docs


logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.http.server.reactive: DEBUG
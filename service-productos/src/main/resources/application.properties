spring.application.name=service-productos
server.port = 8082

#Conexion a DB Productos
spring.datasource.url = jdbc:mysql://localhost:3306/db_productos?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password =
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

# Ruta donde se generará el JSON de la documentación
springdoc.api-docs.path=/api/v1/productos/v3/api-docs

# Título de la documentación
springdoc.swagger-ui.path=/swagger-ui.html